name: Build Thanda LoRa Flasher

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v0.5.0-alpha)
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, windows, macos, linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/flasher/package-lock.json

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: tools/flasher/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tools/flasher/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: cd tools/flasher && npm install
      - name: Build frontend
        run: cd tools/flasher && npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tools/flasher/dist

  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          # Full matrix
          ALL_MATRIX='{"include":[{"platform":"windows-x64","os":"windows-latest"},{"platform":"macos-arm64","os":"macos-latest"},{"platform":"macos-x86_64","os":"macos-latest"},{"platform":"linux-x64","os":"ubuntu-22.04"}]}'
          
          if [[ "$PLATFORM" == "all" ]]; then
            echo "matrix=$ALL_MATRIX" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "windows" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"windows-x64\",\"os\":\"windows-latest\"}]}" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "linux" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"linux-x64\",\"os\":\"ubuntu-22.04\"}]}" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "macos" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"macos-arm64\",\"os\":\"macos-latest\"},{\"platform\":\"macos-x86_64\",\"os\":\"macos-latest\"}]}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build for ${{ matrix.platform }}
    needs: [build-frontend, setup]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/flasher/src-tauri

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: tools/flasher/dist

      - name: Build Firmware Binaries
        shell: bash
        run: |
          python -m pip install --upgrade platformio
          python -m platformio run -e lrs_za -e lrs_us
          mkdir -p tools/flasher/src-tauri/resources
          cp .pio/build/lrs_za/firmware.bin tools/flasher/src-tauri/resources/firmware-za.bin
          cp .pio/build/lrs_us/firmware.bin tools/flasher/src-tauri/resources/firmware-us.bin
          cp VERSION tools/flasher/src-tauri/resources/VERSION

      - name: Install esptool Sidecars
        shell: bash
        run: |
          cd tools/flasher/src-tauri
          mkdir -p bin bin_tmp
          VERSION_ESP="v4.8.1"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            curl -L -o esptool.zip https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-win64.zip
            unzip esptool.zip -d bin_tmp && mv bin_tmp/*/esptool.exe bin/esptool-x86_64-pc-windows-msvc.exe && rm -rf bin_tmp esptool.zip
          elif [[ "${{ matrix.platform }}" == "macos-arm64" ]]; then
            curl -L -o esptool.zip https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-macos.zip
            unzip esptool.zip -d bin_tmp && find bin_tmp -name esptool -type f -exec cp {} bin/esptool-aarch64-apple-darwin \; && rm -rf bin_tmp esptool.zip
          elif [[ "${{ matrix.platform }}" == "macos-x86_64" ]]; then
            curl -L -o esptool.zip https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-macos.zip
            unzip esptool.zip -d bin_tmp && find bin_tmp -name esptool -type f -exec cp {} bin/esptool-x86_64-apple-darwin \; && rm -rf bin_tmp esptool.zip
          else
            curl -L -o esptool.tar.gz https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-linux-amd64.tar.gz
            tar -xzf esptool.tar.gz -C bin_tmp && find bin_tmp -name esptool -type f -exec cp {} bin/esptool-x86_64-unknown-linux-gnu \; && rm -rf bin_tmp esptool.tar.gz
          fi
          chmod +x bin/esptool*

      - name: Install Apple Certificate
        if: startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Tauri App
        run: |
          cd tools/flasher
          npm install
          npm run tauri build -- --target ${{ matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir final_dist
          mv tools/flasher/src-tauri/target/release/bundle/msi/*.msi "final_dist/thanda-lora-flasher-${VERSION}-windows-x64.msi"
          mv tools/flasher/src-tauri/target/release/bundle/nsis/*.exe "final_dist/thanda-lora-flasher-${VERSION}-windows-x64-setup.exe"

      - name: Package MacOS
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCH="x64"
          if [[ "${{ matrix.os }}" == "macos-14" ]]; then ARCH="arm64"; fi
          mkdir final_dist
          brew install create-dmg
          
          APP_PATH=$(find tools/flasher/src-tauri/target -name "thanda-lora-flasher.app" -type d | head -n 1)
          
          create-dmg \
            --volname "Thanda LoRa Flasher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Thanda LoRa Flasher.app" 150 150 \
            --app-drop-link 450 150 \
            "final_dist/thanda-lora-flasher-${VERSION}-macos-${ARCH}.dmg" \
            "$APP_PATH"

      - name: Package Linux
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir final_dist
          mv tools/flasher/src-tauri/target/release/bundle/appimage/*.AppImage "final_dist/thanda-lora-flasher-${VERSION}-linux-x64.AppImage"
          mv tools/flasher/src-tauri/target/release/bundle/deb/*.deb "final_dist/thanda-lora-flasher-${VERSION}-linux-x64.deb"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flasher-${{ matrix.platform }}
          path: final_dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() && 
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect Assets
        run: |
          mkdir all_assets
          # Collect successfully built flasher binaries
          shopt -s nullglob
          for f in flasher-*/thanda-lora-flasher-*; do
            cp "$f" all_assets/
          done
          shopt -u nullglob

      - name: Build Firmware for Release
        shell: bash
        run: |
          pip install platformio
          pio run -e lrs_za -e lrs_us
          VERSION=${GITHUB_REF_NAME#v}
          ZA_BIN=".pio/build/lrs_za/firmware.bin"
          US_BIN=".pio/build/lrs_us/firmware.bin"
          
          # Copy binaries
          cp "$ZA_BIN" "all_assets/lrs-firmware-${VERSION}-za.bin"
          cp "$US_BIN" "all_assets/lrs-firmware-${VERSION}-us.bin"
          
          # Generate Checksums
          echo "### SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "| File | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          
          ZA_HASH=$(shasum -a 256 "$ZA_BIN" | cut -d ' ' -f 1)
          US_HASH=$(shasum -a 256 "$US_BIN" | cut -d ' ' -f 1)
          
          echo "| lrs-firmware-${VERSION}-za.bin | $ZA_HASH |" >> $GITHUB_STEP_SUMMARY
          echo "| lrs-firmware-${VERSION}-us.bin | $US_HASH |" >> $GITHUB_STEP_SUMMARY
          
          # Store hashes for release body
          echo "ZA_HASH=$ZA_HASH" >> $GITHUB_ENV
          echo "US_HASH=$US_HASH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} Creation
          files: all_assets/*
          body: |
            ## Thanda LoRa v0.5.0-alpha Creation
            
            ### Native Flasher (Tauri)
            The flasher has been completely rebuilt as a native application for professional performance and stability.
            
            **Legacy Note**: The Python/Flet-based flasher is now **DEPRECATED** and no longer included in releases.
            
            ### Changes
            - ⚡️ New high-performance native core (Tauri/Vue.js).
            - 🔍 Dedicated Activity Log with real-time progress.
            - 🖥 Immersive Monitor Mode.
            - 🔄 Auto-Monitor after successful flash.
            - 🪄 Polished Glassmorphism aesthetics.
            - 📂 Native System File Pickers.
            
            ### Firmware Checksums
            - **ZA Region**: `${{ env.ZA_HASH }}`
            - **US Region**: `${{ env.US_HASH }}`
            
            > "Imagination is the beginning of creation. You imagine what you desire, you will what you imagine, and at last, you create what you will."
            > — **George Bernard Shaw**
            
            Please download the appropriate version for your operating system below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Release Assets to Public Hub
        run: |
          TAG=${{ github.ref_name }}
          # Check if assets exist before creating release
          if [ -z "$(ls -A all_assets)" ]; then
            echo "No assets to mirror, skipping."
            exit 0
          fi

          gh release view $TAG --repo warwickchapman/lora-rs --json name,body,isPrerelease > release_info.json || true
          TITLE=$(jq -r '.name // empty' release_info.json)
          IS_PRE=$(jq -r '.isPrerelease // "false"' release_info.json)
          
          [ -z "$TITLE" ] && TITLE="$TAG Creation"
          
          gh release delete $TAG --repo warwickchapman/lora-rs-firmware -y || true
          
          mkdir public_assets
          cp all_assets/* public_assets/ || true
          
          # Clone ZA firmware for EU region
          cd public_assets
          for f in *-za.bin; do
            if [ -f "$f" ]; then
              cp "$f" "${f%-za.bin}-eu.bin"
            fi
          done
          cd ..
          
          LATEST_FLAG=""
          if [[ "$IS_PRE" == "true" ]]; then
            LATEST_FLAG="--latest=false"
          else
            LATEST_FLAG="--latest"
          fi
          
          gh release create $TAG public_assets/* \
            --repo warwickchapman/lora-rs-firmware \
            --title "$TITLE" \
            --notes "See private repository for full details. v0.5.0-alpha Native Release." \
            --prerelease=$IS_PRE \
            $LATEST_FLAG
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
