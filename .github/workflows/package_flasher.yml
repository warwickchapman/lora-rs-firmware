name: Build LRS Flasher

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install flet pyinstaller
          pip install -r tools/flasher/requirements.txt

      - name: Build with Flet Pack
        shell: bash
        run: |
          cd tools/flasher
          # Use flet pack for better bundling of runtime components
          flet pack main.py --name "thanda-lora-flasher" || flet pack main.py --name "thanda-lora-flasher"
          
          # Move to a predictable name for the artifact upload
          mkdir -p final_dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/thanda-lora-flasher.exe final_dist/thanda-lora-flasher.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Create DMG for macOS
            mkdir -p dmg_root
            cp -r dist/thanda-lora-flasher.app dmg_root/
            hdiutil create -volname "thanda-lora-flasher" -srcfolder dmg_root -ov -format UDZO thanda-lora-flasher.dmg
            mv thanda-lora-flasher.dmg final_dist/
          else
            mv dist/thanda-lora-flasher final_dist/thanda-lora-flasher-linux
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: tools/flasher/final_dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            windows-latest-artifact/*
            macos-latest-artifact/*
            ubuntu-latest-artifact/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror to Public Hub
        run: |
          TAG=${{ github.ref_name }}
          
          # 1. Sync Source Code to 'flasher/' subdirectory
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/warwickchapman/lora-rs-firmware.git public_repo
          rm -rf public_repo/flasher
          mkdir -p public_repo/flasher
          cp tools/flasher/main.py tools/flasher/logic.py tools/flasher/requirements.txt tools/flasher/run.sh public_repo/flasher/
          
          cd public_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flasher/
          git commit -m "Update Flasher source code for $TAG" || echo "No changes"
          git push origin main
          
          # 2. Mirror All Release Assets to Public Repo
          cd ..
          # Fetch title and notes from private repo
          gh release view $TAG --repo warwickchapman/lora-rs --json name,body > release_info.json
          TITLE=$(jq -r '.name' release_info.json)
          jq -r '.body' release_info.json > release_notes.md
          
          # Delete if exists and recreate public release with ALL assets (bins + flasher tools)
          gh release delete $TAG --repo warwickchapman/lora-rs-firmware -y || true
          
          # Download all assets from the CURRENT release (including the newly uploaded ones)
          mkdir public_assets
          gh release download $TAG --dir public_assets --repo warwickchapman/lora-rs
          
          # 3. Duplicate ZA firmware for EU region
          cd public_assets
          for f in *-za.bin; do
            if [ -f "$f" ]; then
              cp "$f" "${f%-za.bin}-eu.bin"
              echo "Cloned $f to ${f%-za.bin}-eu.bin"
            fi
          done
          cd ..
          
          gh release create $TAG public_assets/* \
            --repo warwickchapman/lora-rs-firmware \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --prerelease=${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }} \
            --latest
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
