name: Build LRS Flasher

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel, macos-14, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Disk Space (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          sudo rm -rf /Applications/Xcode*
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /opt/homebrew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ startsWith(matrix.os, 'macos-') && '3.10' || '3.12' }}

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -U flet pyinstaller Pillow
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            pip install pyobjc
          fi
          pip install -r tools/flasher/requirements.txt
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libmpv-dev
          fi

      - name: Generate Icons
        shell: bash
        run: |
          python tools/flasher/generate_icons.py

      - name: Build with Flet Pack
        shell: bash
        run: |
          cd tools/flasher
          # Set platform-specific icon
          export LRS_VERSION="${GITHUB_REF_NAME#v}"
          export CODESIGN_IDENTITY="-"
          ESPTOOL_DIR=$(python -c "import esptool, os; print(os.path.dirname(esptool.__file__))")

          ICON_ARG="--icon assets/icon_512.png"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then ICON_ARG="--icon assets/thanda_lora.ico"; fi
          
          # Configure PyInstaller target architecture for macOS
          EXTRA_BIN=""
          if [[ "${{ matrix.os }}" == "macos-15-intel" ]]; then
            export EXTRA_BIN="--target-arch x86_64"
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            export EXTRA_BIN="--target-arch arm64"
          fi
          
          # Set platform-specific separator for --add-data
          SEP=":"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then SEP=";"; fi
          
          # Set platform-specific icon
          ICON_ARG="--icon assets/icon_512.png"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then ICON_ARG="--icon assets/thanda_lora.ico"; fi
          
          # Linux Portability: Explicitly bundle libmpv.so.* and ensure it has the .so.1 alias
          EXTRA_BIN=""
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            # Find the actual library (could be .so.1 or .so.2)
            LIBMPV_PATH=$(find /usr/lib -name "libmpv.so.*" | grep -v "dev" | head -n 1)
            if [ -n "$LIBMPV_PATH" ]; then
              # Bundle the actual file
              EXTRA_BIN="--add-binary $LIBMPV_PATH:."
              echo "Found and bundling libmpv: $LIBMPV_PATH"
            fi
          fi

          # Use flet pack for better bundling of runtime components
          # Include esptool targets (stubs) and application assets (logo)
          flet pack main.py --name "Thanda LoRa Flasher" \
            $ICON_ARG \
            $EXTRA_BIN \
            --clean \
            --codesign-identity "" \
            --add-data "$ESPTOOL_DIR/targets${SEP}esptool/targets" \
            --add-data "../../VERSION${SEP}VERSION" \
            --add-data "assets${SEP}assets"
          
          # Verification step: ensure the build output exists
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ ! -f "dist/Thanda LoRa Flasher.exe" ]; then echo "ERROR: EXE not found"; exit 1; fi
          if [[ "${{ matrix.os }}" == macos-* ]] && [ ! -d "dist/Thanda LoRa Flasher.app" ]; then echo "ERROR: APP bundle not found"; exit 1; fi
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]] && [ ! -f "dist/Thanda LoRa Flasher" ]; then echo "ERROR: Linux binary not found"; exit 1; fi
          
          # Move to a predictable name for the artifact upload
          mkdir -p final_dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "dist/Thanda LoRa Flasher.exe" "final_dist/Thanda LoRa Flasher-x64.exe"
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            # Create DMG for macOS with Applications shortcut
            mkdir -p dmg_root
            cp -r "dist/Thanda LoRa Flasher.app" dmg_root/
            ln -s /Applications dmg_root/Applications
            hdiutil create -volname "Thanda LoRa Flasher" -srcfolder dmg_root -ov -format UDZO "Thanda LoRa Flasher.dmg"
            
            # Add architecture suffix
            ARCH="intel"
            if [[ "${{ matrix.os }}" == "macos-14" ]]; then ARCH="silicon"; fi
            mv "Thanda LoRa Flasher.dmg" "final_dist/Thanda LoRa Flasher-$ARCH.dmg"
          else
            mv "dist/Thanda LoRa Flasher" "final_dist/Thanda LoRa Flasher-linux"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: tools/flasher/final_dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            windows-latest-artifact/*
            macos-15-intel-artifact/*
            macos-14-artifact/*
            ubuntu-latest-artifact/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Release Assets to Public Hub
        run: |
          TAG=${{ github.ref_name }}
          
          # 1. Fetch title, notes, AND pre-release status from private repo
          gh release view $TAG --repo warwickchapman/lora-rs --json name,body,isPrerelease > release_info.json
          TITLE=$(jq -r '.name' release_info.json)
          IS_PRE=$(jq -r '.isPrerelease' release_info.json)
          jq -r '.body' release_info.json > release_notes.md
          
          # 2. Mirror All Release Assets to Public Repo
          # Delete if exists and recreate public release with ALL assets
          gh release delete $TAG --repo warwickchapman/lora-rs-firmware -y || true
          
          # Download all assets from the CURRENT release
          mkdir public_assets
          gh release download $TAG --dir public_assets --repo warwickchapman/lora-rs
          
          # 3. Duplicate ZA firmware for EU region
          cd public_assets
          for f in *-za.bin; do
            if [ -f "$f" ]; then
              cp "$f" "${f%-za.bin}-eu.bin"
              echo "Cloned $f to ${f%-za.bin}-eu.bin"
            fi
          done
          cd ..
          
          LATEST_FLAG=""
          if [[ "$IS_PRE" == "true" ]]; then
            LATEST_FLAG="--latest=false"
          else
            LATEST_FLAG="--latest"
          fi
          
          gh release create $TAG public_assets/* \
            --repo warwickchapman/lora-rs-firmware \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --prerelease=$IS_PRE \
            $LATEST_FLAG
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
