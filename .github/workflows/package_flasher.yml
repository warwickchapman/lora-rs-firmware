name: Build Thanda LoRa Flasher

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v0.5.0-alpha)
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, windows, macos, linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/flasher/package-lock.json

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: tools/flasher/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tools/flasher/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: cd tools/flasher && npm install
      - name: Build frontend
        run: cd tools/flasher && npm run build
      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tools/flasher/dist

  setup:
    name: Setup Matrix & Version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-version.outputs.tag }}
      version: ${{ steps.set-version.outputs.version }}
      skip_flasher: ${{ steps.check-skip.outputs.skip_flasher }}
    steps:
      - uses: actions/checkout@v4
      - id: set-version
        run: |
          VERSION_RAW=$(cat VERSION)
          TAG="${VERSION_RAW}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v${VERSION_RAW}"; fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Also set for locally-running shell steps in this job
          echo "CI_TAG=$TAG" >> $GITHUB_ENV
          echo "CI_VERSION=$VERSION" >> $GITHUB_ENV

      - id: set-matrix
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          # Default matrix for tag-triggered release builds (cost-controlled):
          # macOS is intentionally excluded and handled by local/manual builds.
          TAG_MATRIX='{"include":[{"platform":"windows-x64","os":"windows-latest","target_triple":"x86_64-pc-windows-msvc"},{"platform":"linux-x64","os":"ubuntu-22.04","target_triple":"x86_64-unknown-linux-gnu"}]}'
          # Full matrix (manual only)
          ALL_MATRIX='{"include":[{"platform":"windows-x64","os":"windows-latest","target_triple":"x86_64-pc-windows-msvc"},{"platform":"macos-arm64","os":"macos-latest","target_triple":"aarch64-apple-darwin"},{"platform":"macos-x86_64","os":"macos-latest","target_triple":"x86_64-apple-darwin"},{"platform":"linux-x64","os":"ubuntu-22.04","target_triple":"x86_64-unknown-linux-gnu"}]}'
          
          if [[ "$PLATFORM" == "all" ]]; then
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
              echo "matrix=$TAG_MATRIX" >> $GITHUB_OUTPUT
            else
              echo "matrix=$ALL_MATRIX" >> $GITHUB_OUTPUT
            fi
          elif [[ "$PLATFORM" == "windows" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"windows-x64\",\"os\":\"windows-latest\",\"target_triple\":\"x86_64-pc-windows-msvc\"}]}" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "linux" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"linux-x64\",\"os\":\"ubuntu-22.04\",\"target_triple\":\"x86_64-unknown-linux-gnu\"}]}" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "macos" ]]; then
            echo "matrix={\"include\":[{\"platform\":\"macos-arm64\",\"os\":\"macos-latest\",\"target_triple\":\"aarch64-apple-darwin\"},{\"platform\":\"macos-x86_64\",\"os\":\"macos-latest\",\"target_triple\":\"x86_64-apple-darwin\"}]}" >> $GITHUB_OUTPUT
          fi

      - id: check-skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.set-version.outputs.tag }}"
          SKIP="false"
          # Check if the release already exists and has the SKIP flag in the body
          BODY=$(gh release view "$TAG" --repo ${{ github.repository }} --json body --jq '.body' 2>/dev/null || echo "")
          if [[ "$BODY" == *"SKIP_FLASHER_BUILD"* ]]; then
            echo "Detected SKIP_FLASHER_BUILD flag in release notes."
            SKIP="true"
          fi
          echo "skip_flasher=$SKIP" >> $GITHUB_OUTPUT

  build:
    name: Build for ${{ matrix.platform }}
    needs: [build-frontend, setup]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.skip_flasher != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_triple }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/flasher/src-tauri

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev libudev-dev rpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: tools/flasher/dist

      - name: Prepare Sidecar Resources
        shell: bash
        run: |
          mkdir -p tools/flasher/src-tauri/resources
          # Copy VERSION
          cp VERSION tools/flasher/src-tauri/resources/VERSION
          
          # Note: Firmware .bin files are now expected to be pushed from local
          # We search for them in the repo to bundle into the flasher if they exist
          find . -name "firmware.bin" | while read -r bin; do
            env_name=$(echo "$bin" | awk -F'/' '{print $(NF-1)}')
            if [[ "$env_name" == "lrs_za" ]]; then cp "$bin" tools/flasher/src-tauri/resources/firmware-za.bin; fi
            if [[ "$env_name" == "lrs_us" ]]; then cp "$bin" tools/flasher/src-tauri/resources/firmware-us.bin; fi
          done

      - name: Install esptool Sidecars
        shell: bash
        run: |
          cd tools/flasher/src-tauri
          mkdir -p bin_tmp
          VERSION_ESP="v4.8.1"
          TRIPLE="${{ matrix.target_triple }}"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            URL="https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-win64.zip"
            curl -L -o esptool.zip "$URL"
            unzip esptool.zip -d bin_tmp
            find bin_tmp -name esptool.exe -exec cp {} "esptool-${TRIPLE}.exe" \;
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            URL="https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-macos.zip"
            curl -L -o esptool.zip "$URL"
            unzip esptool.zip -d bin_tmp
            find bin_tmp -name esptool -type f -exec cp {} "esptool-${TRIPLE}" \;
          else
            URL="https://github.com/espressif/esptool/releases/download/${VERSION_ESP}/esptool-${VERSION_ESP}-linux-amd64.zip"
            curl -L -o esptool.zip "$URL"
            unzip esptool.zip -d bin_tmp
            find bin_tmp -name esptool -type f -exec cp {} "esptool-${TRIPLE}" \;
          fi
          rm -rf bin_tmp esptool.zip
          chmod +x esptool*

      - name: Build Tauri App
        shell: bash
        run: |
          cd tools/flasher
          VERSION_RAW=$(cat ../../VERSION)
          VERSION=${VERSION_RAW#v}
          PACKAGE_VERSION="${VERSION}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # MSI internal app version must be numeric-only (no prerelease suffix).
            PACKAGE_VERSION="${VERSION%%-*}"
          fi

          # Keep package metadata aligned with release VERSION so OS package upgrades work.
          python3 - <<PY
          from pathlib import Path
          import json
          import re
          
          version = "${PACKAGE_VERSION}"
          
          tauri_conf_path = Path("src-tauri/tauri.conf.json")
          tauri_conf = json.loads(tauri_conf_path.read_text(encoding="utf-8"))
          tauri_conf["version"] = version
          tauri_conf_path.write_text(json.dumps(tauri_conf, indent=2) + "\n", encoding="utf-8")
          
          cargo_path = Path("src-tauri/Cargo.toml")
          text = cargo_path.read_text(encoding="utf-8")
          text_new = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
          if text_new == text:
              raise SystemExit("Failed to update Cargo.toml version")
          cargo_path.write_text(text_new, encoding="utf-8")
          PY

          npm install
          # Unset PKG_CONFIG_PATH on Linux to avoid python-cache interference with system libs
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then unset PKG_CONFIG_PATH; fi
          # Note: MacOS handles ad-hoc signing (-) if no secrets provided
          npm run tauri build -- --target ${{ matrix.target_triple }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION_RAW=$(cat VERSION)
          VERSION=${VERSION_RAW#v}
          mkdir final_dist
          TRIPLE="${{ matrix.target_triple }}"
          mv tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/msi/*.msi "final_dist/thanda-lora-flasher-${VERSION}-windows-x64.msi"
          mv tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/nsis/*.exe "final_dist/thanda-lora-flasher-${VERSION}-windows-x64-setup.exe"

          # Build a portable ZIP from the packaged app layout when available,
          # falling back to the release exe + sidecar if needed.
          PORTABLE_ROOT="final_dist/windows-portable"
          mkdir -p "$PORTABLE_ROOT"
          BUNDLE_DIR="tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/nsis"
          if compgen -G "${BUNDLE_DIR}/*" > /dev/null; then
            APPDIR=$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name "Thanda LoRa Flasher*" | head -n1 || true)
            if [[ -n "${APPDIR}" ]]; then
              cp -R "${APPDIR}/." "$PORTABLE_ROOT/"
            fi
          fi

          if [[ ! -f "$PORTABLE_ROOT/thanda-lora-flasher.exe" ]]; then
            cp "tools/flasher/src-tauri/target/${TRIPLE}/release/thanda-lora-flasher.exe" "$PORTABLE_ROOT/"
          fi

          if [[ -f "tools/flasher/src-tauri/esptool-${TRIPLE}.exe" ]]; then
            cp "tools/flasher/src-tauri/esptool-${TRIPLE}.exe" "$PORTABLE_ROOT/"
          fi

          if [[ -d "tools/flasher/src-tauri/resources" ]]; then
            cp -R "tools/flasher/src-tauri/resources" "$PORTABLE_ROOT/resources"
          fi

          (
            cd "$PORTABLE_ROOT"
            zip -r "../thanda-lora-flasher-${VERSION}-windows-x64-portable.zip" .
          )

      - name: Package MacOS
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          CREATE_RELEASE_INPUT: ${{ github.event.inputs.create_release || 'false' }}
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.setup.outputs.version }}"
          TRIPLE="${{ matrix.target_triple }}"
          ARCH="x64"
          if [[ "$TRIPLE" == "aarch64-apple-darwin" ]]; then ARCH="arm64"; fi
          
          mkdir -p final_dist

          IS_RELEASE_BUILD="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_RELEASE_BUILD="true"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${CREATE_RELEASE_INPUT}" == "true" ]]; then
            IS_RELEASE_BUILD="true"
          fi

          HAS_CERT="false"
          if [[ -n "${APPLE_DEVELOPER_ID_CERT_P12_BASE64:-}" && -n "${APPLE_DEVELOPER_ID_CERT_PASSWORD:-}" ]]; then
            HAS_CERT="true"
          fi
          HAS_NOTARY_APPLE_ID="false"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            HAS_NOTARY_APPLE_ID="true"
          fi
          HAS_NOTARY_API="false"
          if [[ -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER_ID:-}" && -n "${APPLE_API_PRIVATE_KEY_BASE64:-}" ]]; then
            HAS_NOTARY_API="true"
          fi
          HAS_NOTARY_CREDS="false"
          if [[ "${HAS_NOTARY_APPLE_ID}" == "true" || "${HAS_NOTARY_API}" == "true" ]]; then
            HAS_NOTARY_CREDS="true"
          fi

          if [[ "${IS_RELEASE_BUILD}" == "true" && ( "${HAS_CERT}" != "true" || "${HAS_NOTARY_CREDS}" != "true" ) ]]; then
            echo "ERROR: Release macOS build requires Developer ID certificate + notarization credentials."
            echo "Required cert secrets: APPLE_DEVELOPER_ID_CERT_P12_BASE64, APPLE_DEVELOPER_ID_CERT_PASSWORD"
            echo "Required notarization secrets: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID OR APPLE_API_KEY_ID + APPLE_API_ISSUER_ID + APPLE_API_PRIVATE_KEY_BASE64"
            exit 1
          fi

          SIGN_MODE="adhoc"
          if [[ "${HAS_CERT}" == "true" ]]; then
            SIGN_MODE="developer-id"
          fi
          echo "macOS signing mode: ${SIGN_MODE} (release build: ${IS_RELEASE_BUILD})"

          KEYCHAIN_PATH=""
          KEYCHAIN_PASSWORD=""
          CERT_P12_PATH=""
          API_KEY_PATH=""
          STAGE_DIR=""
          MOUNT_POINT=""
          cleanup() {
            if [[ -n "${MOUNT_POINT}" ]]; then
              hdiutil detach "${MOUNT_POINT}" -quiet >/dev/null 2>&1 || true
            fi
            [[ -n "${STAGE_DIR}" ]] && rm -rf "${STAGE_DIR}" || true
            [[ -n "${MOUNT_POINT}" ]] && rm -rf "${MOUNT_POINT}" || true
            [[ -n "${CERT_P12_PATH}" ]] && rm -f "${CERT_P12_PATH}" || true
            [[ -n "${API_KEY_PATH}" ]] && rm -f "${API_KEY_PATH}" || true
            if [[ -n "${KEYCHAIN_PATH}" ]]; then
              security delete-keychain "${KEYCHAIN_PATH}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          if [[ "${SIGN_MODE}" == "developer-id" ]]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/flasher-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            CERT_P12_PATH="${RUNNER_TEMP}/developer-id-cert.p12"

            if ! printf '%s' "${APPLE_DEVELOPER_ID_CERT_P12_BASE64}" | base64 --decode > "${CERT_P12_PATH}" 2>/dev/null; then
              printf '%s' "${APPLE_DEVELOPER_ID_CERT_P12_BASE64}" | base64 -D > "${CERT_P12_PATH}"
            fi

            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}"
            security import "${CERT_P12_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_DEVELOPER_ID_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          fi
          
          # App structure
          APP_NAME="Thanda LoRa Flasher.app"
          APP_PATH="tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/macos/${APP_NAME}"
          BINARY_PATH="${APP_PATH}/Contents/MacOS/thanda-lora-flasher"
          OUT_DMG="final_dist/thanda-lora-flasher-${VERSION}-macos-${ARCH}.dmg"
          
          # Architecture Verification (Prove architecture before signing)
          echo "### Architecture Verification for $TRIPLE ###"
          FILE_OUT=$(file "$BINARY_PATH")
          echo "$FILE_OUT"
          if [[ "$ARCH" == "x64" ]]; then
            echo "$FILE_OUT" | grep -q "x86_64" || { echo "ERROR: expected x86_64 binary for $TRIPLE"; exit 1; }
          else
            echo "$FILE_OUT" | grep -Eq "arm64|aarch64" || { echo "ERROR: expected arm64 binary for $TRIPLE"; exit 1; }
          fi
          
          # Sign app bundle and verify before packaging.
          if [[ "${SIGN_MODE}" == "developer-id" ]]; then
            SIGN_IDENTITY="${APPLE_DEVELOPER_ID_IDENTITY:-}"
            if [[ -z "${SIGN_IDENTITY}" ]]; then
              SIGN_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            fi
            if [[ -z "${SIGN_IDENTITY}" ]]; then
              echo "ERROR: Could not resolve Developer ID Application identity."
              exit 1
            fi
            echo "Using signing identity: ${SIGN_IDENTITY}"
            codesign --force --deep --options runtime --timestamp --sign "${SIGN_IDENTITY}" "$APP_PATH"
          else
            codesign --force --deep --sign - "$APP_PATH"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vv "$APP_PATH" || true

          # Build UX-friendly DMG layout (large icon + Applications on right).
          brew install create-dmg
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGE_DIR/"
          create-dmg \
            --volname "Thanda LoRa Flasher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}" 150 150 \
            --app-drop-link 450 150 \
            "$OUT_DMG" \
            "$STAGE_DIR/$APP_NAME"

          if [[ "${SIGN_MODE}" == "developer-id" ]]; then
            codesign --force --timestamp --sign "${SIGN_IDENTITY}" "$OUT_DMG"
            codesign --verify --verbose=2 "$OUT_DMG"

            if [[ "${HAS_NOTARY_API}" == "true" ]]; then
              API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
              if ! printf '%s' "${APPLE_API_PRIVATE_KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}" 2>/dev/null; then
                printf '%s' "${APPLE_API_PRIVATE_KEY_BASE64}" | base64 -D > "${API_KEY_PATH}"
              fi
              xcrun notarytool submit "$OUT_DMG" --key "${API_KEY_PATH}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER_ID}" --wait
            else
              xcrun notarytool submit "$OUT_DMG" --apple-id "${APPLE_ID}" --password "${APPLE_APP_SPECIFIC_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
            fi

            xcrun stapler staple "$OUT_DMG"
            xcrun stapler validate "$OUT_DMG"
            spctl -a -vv "$OUT_DMG"
          fi

          # Verify signature survived packaging by checking app inside the DMG.
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$OUT_DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/$APP_NAME"
          codesign -dv --verbose=4 "$MOUNT_POINT/$APP_NAME"
          spctl -a -vv "$MOUNT_POINT/$APP_NAME" || true

      - name: Package Linux
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION_RAW=$(cat VERSION)
          VERSION=${VERSION_RAW#v}
          mkdir final_dist
          TRIPLE="${{ matrix.target_triple }}"
          APPIMAGE_OUT="final_dist/thanda-lora-flasher-${VERSION}-linux-x64.AppImage"
          mv tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/appimage/*.AppImage "$APPIMAGE_OUT"
          chmod +x "$APPIMAGE_OUT"
          tar -C final_dist -czf "final_dist/thanda-lora-flasher-${VERSION}-linux-x64.AppImage.tar.gz" "$(basename "$APPIMAGE_OUT")"
          mv tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/deb/*.deb "final_dist/thanda-lora-flasher-${VERSION}-linux-x64.deb"
          mv tools/flasher/src-tauri/target/${TRIPLE}/release/bundle/rpm/*.rpm "final_dist/thanda-lora-flasher-${VERSION}-linux-x64.rpm"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flasher-${{ matrix.platform }}
          path: final_dist/*

  release:
    name: Create Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.setup.outputs.skip_flasher != 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect Flasher Assets
        run: |
          mkdir all_assets
          shopt -s nullglob
          for f in flasher-*/thanda-lora-flasher-*; do
            cp "$f" all_assets/
          done
          shopt -u nullglob

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: all_assets/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Flasher to Public Hub
        uses: softprops/action-gh-release@v2
        with:
          repository: warwickchapman/lora-rs-firmware
          tag_name: ${{ needs.setup.outputs.tag }}
          files: all_assets/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    services: {} # dummy to find where to put the env
