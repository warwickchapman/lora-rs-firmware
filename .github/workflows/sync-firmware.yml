name: Sync Firmware to Public Repo

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync'
        required: true
        default: 'v0.2.4-alpha'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release Assets
        id: download
        run: |
          # Use release tag if available, otherwise trigger input tag
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release download $TAG --pattern "*.bin" --dir assets || echo "NO_ASSETS=true" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Public Repo
        if: env.NO_ASSETS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: warwickchapman/lora-rs-firmware
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          name: ${{ github.event.release.name || github.event.inputs.tag }}
          body: ${{ github.event.release.body }}
          draft: false
          prerelease: ${{ github.event.release.prerelease || false }}
          files: assets/*.bin
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
