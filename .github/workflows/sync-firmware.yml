name: Sync Firmware to Public Repo

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync'
        required: true
        default: 'v0.2.4-alpha'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release Assets
        id: download
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release download $TAG --pattern "*.bin" --dir assets
          # Check if assets directory is empty or contains no .bin files
          if [ -z "$(ls -A assets 2>/dev/null)" ]; then
            echo "No .bin assets found for tag $TAG"
            echo "NO_ASSETS=true" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Public Release
        if: env.NO_ASSETS != 'true'
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          NAME="${{ github.event.release.name || github.event.inputs.tag }}"
          
          # Fetch notes from private repo and save to a temporary file for safe handling
          gh release view $TAG --repo warwickchapman/lora-rs --json body --jq '.body' > release_notes.md
          
          # Delete existing release in public repo to ensure clean sync
          gh release delete $TAG --repo warwickchapman/lora-rs-firmware -y || true
          
          # Create new release using the notes file
          gh release create $TAG assets/*.bin \
            --repo warwickchapman/lora-rs-firmware \
            --title "$NAME" \
            --notes-file release_notes.md \
            --prerelease=${{ github.event.release.prerelease || 'false' }} 
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
