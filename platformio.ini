; PlatformIO Project Configuration File

[env]
platform = espressif8266@^4
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
  pre:tools/build_metadata.py
  post:tools/post_upload_sticker.py
  post:tools/post_build_versioned_copy.py
; Fallback only: authoritative release version is in repo root VERSION.
custom_fw_version = 0.0.0-dev
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.0.4
  rweather/Crypto@^0.4.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.5

[env:lrs_za]
board = nodemcuv2
build_flags =
  -D REGION_ZA
;  -DLRS_LOG_LEVEL_DEFAULT=3

[env:lrs_us]
board = nodemcuv2
build_flags =
  -D REGION_US

[env:native]
platform = native
framework =
extra_scripts =
lib_deps =
test_framework = unity
test_build_src = yes
build_flags =
  -D UNIT_TEST
  -I test/mocks
build_src_filter =
  +<runtime_utils.cpp>
  +<sensor_registry.cpp>
