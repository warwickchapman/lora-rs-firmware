; PlatformIO Project Configuration File

[env]
platform = espressif8266@^4
framework = arduino
board = nodemcuv2
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
  pre:tools/build_web_console.py
  pre:tools/build_metadata.py
  post:tools/post_upload_sticker.py
; Fallback only: authoritative release version is in repo root VERSION.
custom_fw_version = 0.0.0-dev
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.0.4
  rweather/Crypto@^0.4.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.5

[env:lrs_za]
build_flags =
  -D REGION_ZA
;  -DLRS_LOG_LEVEL_DEFAULT=3
;  -DLRS_ENABLE_AUTOMATIONS=0

[env:lrs_us]
build_flags =
  -D REGION_US

[env:lrs_za_ota_rx_v1-1] ; lrs-000af8e6 // c48fbb5f
extends = env:lrs_za
upload_protocol = espota
upload_port = 192.168.133.11
custom_ota_ip = 192.168.133.11
custom_ota_auth = c48fbb5f
upload_flags =
  --auth=c48fbb5f
extra_scripts =
  pre:tools/build_web_console.py
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py
  
