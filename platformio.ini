; PlatformIO Project Configuration File

[env]
platform = espressif8266@^4
framework = arduino
board = nodemcuv2
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
  pre:tools/build_metadata.py
  post:tools/post_upload_sticker.py
custom_fw_version = 0.2.1-alpha
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.0.4
  rweather/Crypto@^0.4.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.5

[env:lrs_za]
build_flags =
  -D REGION_ZA

[env:lrs_us]
build_flags =
  -D REGION_US

; OTA upload targets (set upload_port to the device LAN mDNS host, e.g. lrs-004a9c27-tx.local)
[env:lrs_za_ota_rx]
extends = env:lrs_za
upload_protocol = espota
upload_port = 192.168.0.212
custom_ota_ip = 192.168.0.212
; OTA auth uses current device Admin password from Web UI (Network) / Factory block.
custom_ota_auth = 5fe074a4
upload_flags =
  --auth=5fe074a4
extra_scripts =
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py

[env:lrs_za_ota_tx]
extends = env:lrs_za
upload_protocol = espota
upload_port = 192.168.0.213
custom_ota_ip = 192.168.0.213
custom_ota_auth = 7720c800
upload_flags =
  --auth=7720c800
extra_scripts =
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py

[env:lrs_za_ota_9f_rx]
extends = env:lrs_za
upload_protocol = espota
upload_port = 192.168.0.40
custom_ota_ip = 192.168.0.40
custom_ota_auth = a9fb68dd
upload_flags =
  --auth=a9fb68dd
extra_scripts =
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py

[env:lrs_za_ota_9f_tx]
extends = env:lrs_za
upload_protocol = espota
upload_port = 192.168.0.41
custom_ota_ip = 192.168.0.41
custom_ota_auth = 852a4580
upload_flags =
  --auth=852a4580
extra_scripts =
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py

[env:lrs_us_ota]
extends = env:lrs_us
upload_protocol = espota
upload_port = lrs.local
custom_ota_ip = lrs.local
custom_ota_auth = REPLACE_WITH_US_ADMIN_PASSWORD
extra_scripts =
  pre:tools/build_metadata.py
  pre:tools/force_ota_port.py
  post:tools/post_upload_sticker.py
