<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoRa DevMon</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>LoRa DevMon</h1>
        <p>Three paired devices: ping + serial console</p>
      </div>
      <div class="topbar-right">
        <div class="mode-toggle" role="tablist" aria-label="View mode">
          <button id="mode-stacked" class="mode-btn mode-active" type="button">Stacked</button>
          <button id="mode-tabbed" class="mode-btn" type="button">Tabbed</button>
        </div>
        <div id="device-tabs" class="device-tabs"></div>
        <div id="ws-status" class="ws-status ws-connecting">connecting</div>
      </div>
    </header>

    <main id="grid" class="grid"></main>

    <template id="slot-template">
      <section class="slot-card">
        <div class="slot-header">
          <h2 class="slot-title"></h2>
          <div class="status-icons">
            <span class="status-icon ip-indicator ip-no_ip" title="IP: no IP learned yet" aria-label="ip status">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 17a8 8 0 0 1 16 0"></path>
                <path d="M7 17a5 5 0 0 1 10 0"></path>
                <path d="M10 17a2 2 0 0 1 4 0"></path>
              </svg>
            </span>
            <span class="status-icon serial-indicator serial-idle" title="Serial: idle" aria-label="serial status">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 7h8v6h2v3h-3v3h-6v-3H6v-3h2z"></path>
              </svg>
            </span>
          </div>
        </div>

        <div class="slot-controls">
          <label>
            <span>IP</span>
            <input class="ip-input" type="text" />
          </label>
          <label>
            <span>Port</span>
            <select class="port-select"></select>
          </label>
          <label>
            <span>Baud</span>
            <input class="baud-input" type="number" min="300" max="3000000" step="100" />
          </label>
          <div class="inline-actions">
            <button class="save-btn">Save</button>
            <button class="start-btn">Connect</button>
            <button class="stop-btn">Stop</button>
            <button class="clear-btn">Clear</button>
          </div>
        </div>

        <div class="log-wrap">
          <button class="copy-log-btn" type="button" title="Copy log">Copy</button>
          <pre class="log-pane"></pre>
        </div>
      </section>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
